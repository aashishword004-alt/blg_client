
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7f5;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .forgot-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .icon-box {
            width: 65px;
            height: 65px;
            background: #d8f3dc;
            color: #2d6a4f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }

        .forgot-card h3 {
            color: #1b4332;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
        }

        .btn-reset {
            background: #2d6a4f;
            color: white;
            padding: 12px;
            border: none;
        }

        .btn-reset:hover {
            background: #1b4332;
            color: white;
        }

        .back-link {
            color: #2d6a4f;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="forgot-card text-center">

        <div class="icon-box">
            🔒
        </div>

        <h3>Forgot Password?</h3>

        <p class="text-muted mt-2 mb-4">
            Don't worry! Enter your registered email address.
            We will send you a password reset link.
        </p>

        <form>
            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">
                    Email Address
                </label>

                <input
                    type="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <button type="submit" class="btn btn-reset w-100">
                Send Reset Link
            </button>
        </form>

        <div class="mt-4">
            <a href="login.html" class="back-link">
                ← Back to Login
            </a>
        </div>

    </div>

</body>
</html>
