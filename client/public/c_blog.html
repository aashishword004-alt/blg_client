
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7f6;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1b4332;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .create-container {
            max-width: 950px;
            margin: 35px auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .page-title {
            color: #1b4332;
            font-weight: 700;
        }

        .form-label {
            font-weight: 600;
            color: #344e41;
        }

        .form-control, .form-select {
            padding: 11px;
            border-radius: 7px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #40916c;
            box-shadow: 0 0 0 0.2rem rgba(64,145,108,.15);
        }

        .btn-create {
            background: #1b4332;
            color: white;
        }

        .btn-create:hover {
            background: #2d6a4f;
            color: white;
        }

        .image-preview {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            display: none;
            margin-top: 12px;
        }

        .required {
            color: red;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">My Blog</a>

            <a href="profile.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-person"></i> Profile
            </a>
        </div>
    </nav>

    <!-- Create Blog Form -->
    <div class="container create-container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="page-title">Create New Blog</h2>
                <p class="text-muted mb-0">Write and publish your blog post.</p>
            </div>
        </div>

        <div class="form-card">

            <form id="createBlogForm" enctype="multipart/form-data">

                <!-- Title -->
                <div class="mb-3">
                    <label class="form-label">
                        Blog Title <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="title"
                        name="title"
                        placeholder="Enter blog title"
                        required
                    >
                </div>

                <!-- Slug -->
                <div class="mb-3">
                    <label class="form-label">Slug</label>

                    <input
                        type="text"
                        class="form-control"
                        id="slug"
                        name="slug"
                        placeholder="blog-title"
                        required
                    >

                    <small class="text-muted">
                        Automatically generated from the title.
                    </small>
                </div>

                <!-- Excerpt -->
                <div class="mb-3">
                    <label class="form-label">
                        Excerpt <span class="required">*</span>
                    </label>

                    <textarea
                        class="form-control"
                        name="excerpt"
                        rows="3"
                        placeholder="Write a short description..."
                        required
                    ></textarea>
                </div>

                <!-- Content -->
                <div class="mb-3">
                    <label class="form-label">
                        Blog Content <span class="required">*</span>
                    </label>

                    <textarea
                        class="form-control"
                        name="content"
                        rows="10"
                        placeholder="Write your blog content here..."
                        required
                    ></textarea>
                </div>

                <!-- Cover Image -->
                <div class="mb-3">
                    <label class="form-label">
                        Cover Image <span class="required">*</span>
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        id="coverImage"
                        name="coverImage"
                        accept="image/*"
                        required
                    >

                    <img
                        id="imagePreview"
                        class="image-preview"
                        alt="Cover preview"
                    >
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label class="form-label">
                        Category <span class="required">*</span>
                    </label>

                    <select
                        class="form-select"
                        name="categoryId"
                        id="categoryId"
                        required
                    >
                        <option value="">Select Category</option>
                        <option value="6aee024dcf3b00142a52b943">
                            Education
                        </option>
                    </select>
                </div>

                <!-- Status -->
                <div class="mb-4">
                    <label class="form-label">
                        Blog Status <span class="required">*</span>
                    </label>

                    <select
                        class="form-select"
                        name="status"
                        id="status"
                        required
                    >
                        <option value="draft">Draft</option>
                        <option value="published">Published</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-create px-4">
                        <i class="bi bi-plus-circle"></i>
                        Create Blog
                    </button>

                    <button type="reset" class="btn btn-outline-secondary px-4">
                        Clear
                    </button>

                </div>

            </form>

        </div>
    </div>

    <script>
        // Automatically generate slug from title
        document.getElementById("title").addEventListener("input", function () {
            let slug = this.value
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9\s-]/g, "")
                .replace(/\s+/g, "-")
                .replace(/-+/g, "-");

            document.getElementById("slug").value = slug;
        });

        // Image Preview
        document.getElementById("coverImage").addEventListener("change", function () {
            let file = this.files[0];
            let preview = document.getElementById("imagePreview");

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            } else {
                preview.style.display = "none";
                preview.src = "";
            }
        });

        // Form submission placeholder
        document.getElementById("createBlogForm").addEventListener("submit", function (event) {
            event.preventDefault();

            alert("Form design is ready. Connect your Create Blog API to save the blog.");
        });
    </script>

</body>
</html>
