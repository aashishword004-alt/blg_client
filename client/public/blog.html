
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - MyBlog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7f5;
            font-family: Arial, sans-serif;
            padding-bottom: 85px;
        }

        .navbar {
            background: #1b4332;
        }

        .navbar-brand {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: white;
        }

        .create-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
        }

        .page-title {
            color: #1b4332;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control,
        .form-select {
            padding: 11px;
            border-radius: 7px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #2d6a4f;
            box-shadow: 0 0 0 0.2rem rgba(45,106,79,0.15);
        }

        textarea {
            resize: vertical;
        }

        .publish-btn {
            background: #2d6a4f;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 7px;
        }

        .publish-btn:hover {
            background: #1b4332;
            color: white;
        }

        .cancel-btn {
            padding: 10px 25px;
            border-radius: 7px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 5px;
            box-shadow: 0 -3px 12px rgba(0,0,0,0.08);
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: #777;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 23px;
        }

        .nav-item.active {
            color: #2d6a4f;
            font-weight: bold;
        }

        .nav-item:hover {
            color: #2d6a4f;
        }

        @media(max-width: 576px) {
            .create-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="home.html">MyBlog</a>
            <span class="text-white">
                <i class="bi bi-pencil-square fs-5"></i>
            </span>
        </div>
    </nav>

    <!-- Create Blog Form -->
    <div class="container mt-4">

        <div class="mb-4">
            <h3 class="page-title">Create New Blog</h3>
            <p class="text-muted">Write and share your thoughts with the community.</p>
        </div>

        <div class="create-card">

            <form>

                <!-- Title -->
                <div class="mb-4">
                    <label class="form-label">Blog Title</label>
                    <input type="text"
                           class="form-control"
                           name="title"
                           placeholder="Enter your blog title"
                           required>
                </div>

                <!-- Excerpt -->
                <div class="mb-4">
                    <label class="form-label">Excerpt</label>
                    <textarea class="form-control"
                              name="excerpt"
                              rows="3"
                              placeholder="Write a short description..."
                              required></textarea>
                </div>

                <!-- Category -->
                <div class="mb-4">
                    <label class="form-label">Select Category</label>

                    <select class="form-select" name="category_id" required>
                        <option value="" selected disabled>
                            Select Blog Category
                        </option>

                        <option value="1">Technology</option>
                        <option value="2">Programming</option>
                        <option value="3">Education</option>
                        <option value="4">Business</option>
                        <option value="5">Lifestyle</option>
                        <option value="6">Health</option>
                    </select>
                </div>

                <!-- Content -->
                <div class="mb-4">
                    <label class="form-label">Blog Content</label>
                    <textarea class="form-control"
                              name="content"
                              rows="10"
                              placeholder="Write your complete blog content here..."
                              required></textarea>
                </div>

                <!-- Status -->
                <div class="mb-4">
                    <label class="form-label">Blog Status</label>

                    <select class="form-select" name="status" required>
                        <option value="" selected disabled>Select Status</option>
                        <option value="draft">Draft</option>
                        <option value="published">Published</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2 flex-wrap">

                    <button type="submit" class="btn publish-btn">
                        <i class="bi bi-check-circle"></i>
                        Save Blog
                    </button>

                    <a href="home.html" class="btn btn-outline-secondary cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

    <!-- Bottom Navigation -->
    <footer class="bottom-nav">

        <a href="home.html" class="nav-item">
            <i class="bi bi-house-door"></i>
            <span>Home</span>
        </a>

        <a href="create-blog.html" class="nav-item active">
            <i class="bi bi-plus-square-fill"></i>
            <span>Create Blog</span>
        </a>

        <a href="users.html" class="nav-item">
            <i class="bi bi-people"></i>
            <span>Users</span>
        </a>

        <a href="profile.html" class="nav-item">
            <i class="bi bi-person-circle"></i>
            <span>Profile</span>
        </a>

    </footer>

</body>
</html>
